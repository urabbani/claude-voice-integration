[project]
name = "claude-voice-server"
version = "1.0.0"
description = "Speech-to-text server using Whisper with CUDA acceleration"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "faster-whisper>=1.0.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
